<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TPS — Pilkades Live Count</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%230d1b3e%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2760%27 font-family=%27Arial%27 fill=%27%23ffffff%27 text-anchor=%27middle%27%3EP%3C/text%3E%3C/svg%3E" />
  <meta name="theme-color" content="#111111" />
  <link rel="preconnect" href="https://srlsyxlkcgscbngbrqzw.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://srlsyxlkcgscbngbrqzw.supabase.co" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Pilkades" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/nav.css" />
  <link rel="stylesheet" href="../css/tps.css" />
</head>
<body>
  <div class="page-header">
    <div class="topbar-left">
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Buka menu"><span></span><span></span><span></span></button>
      <span class="wordmark">Pilkades Live Count</span>
    </div>
  </div>

  <div class="page-body">
    <div class="page-header-row">
      <div>
        <div class="page-title">Manajemen TPS</div>
        <div class="page-sub">Tambah, ubah, verifikasi, kunci, dan buka kunci hasil per TPS.</div>
      </div>
      <button id="addTpsBtn" class="primary">+ Tambah TPS</button>
    </div>

    <div class="tps-form hidden" id="tpsForm">
      <h3 id="tpsFormTitle">Tambah TPS</h3>
      <div class="tps-form-row">
        <label>Nomor TPS</label>
        <input type="number" id="fieldTpsNumber" min="1" inputmode="numeric" />
      </div>
      <div class="tps-form-row">
        <label>Nama TPS (opsional)</label>
        <input type="text" id="fieldTpsName" placeholder="mis. Balai Dusun Krajan" />
      </div>
      <div class="tps-form-row">
        <label>Batas DPT (opsional)</label>
        <input type="number" id="fieldTpsDpt" min="1" inputmode="numeric" placeholder="mis. 500" />
      </div>
      <div class="tps-form-actions">
        <button id="cancelTpsFormBtn">Batal</button>
        <button id="saveTpsFormBtn" class="primary">Simpan</button>
      </div>
    </div>

    <div class="panel">
      <div class="tps-table" id="tpsTable">
        <div class="tps-row head">
          <span>TPS</span>
          <span>Status</span>
          <span></span>
          <span class="votes">Sah</span>
          <span class="votes">Tidak Sah</span>
          <span class="votes">Total</span>
          <span></span>
        </div>
        <!-- rows rendered by tps-manage.js -->
      </div>
    </div>
  </div>

  <div id="toast" class="hidden" role="status" aria-live="assertive"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/tps-manage.js"></script>
  <script>
    initNav({ active: 'tps', hamburgerTarget: '#hamburgerBtn', links: [
        { key: 'dashboard', label: 'Dashboard (Publik)', href: '../index.html' },
        { key: 'input', label: 'Rapid Input', href: 'input.html' },
        { key: 'tps', label: 'TPS', href: 'tps.html' },
        { key: 'candidates', label: 'Kelola Paslon', href: 'candidates.html' },
        { key: 'logs', label: 'Log Aktivitas', href: 'logs.html' },
        { key: 'export', label: 'Export', href: 'export.html' },
        { key: 'snapshots', label: 'Snapshot', href: 'snapshots.html' },
        { key: 'settings', label: 'Pengaturan', href: 'settings.html' },
      ] });
  </script>
  <script src="../js/pwa.js"></script>
</body>
</html>
